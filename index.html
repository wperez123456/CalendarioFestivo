<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Eventos</title>

    <link rel="icon" type="image/svg+xml" href="eventos-icon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="image/icono-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="image/icono-180x180.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    
    <link href="https://fonts.googleapis.com/css2?family=Brush+Script+MT:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Comic+Sans+MS:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <div class="month-title" id="monthDisplay" aria-live="polite"></div>
    <div class="nav-controls">
        <label class="profile-control" for="profileSelect">Perfil
            <select id="profileSelect" aria-label="Perfil activo">
                <option value="erica">Erica</option>
                <option value="wilmer">Wilmer</option>
            </select>
        </label>
        <button type="button" id="notifyButton" class="notify-button">Activar avisos</button>
        <label class="month-control" for="monthSelect">Mes
            <select id="monthSelect" aria-label="Mes visible" onchange="changeMonthSelect()"></select>
        </label>
        <select id="yearSelect" onchange="changeYear()">
            <option value="2025">2025</option>
            <option value="2026">2026</option>
            <option value="2027">2027</option>
        </select>
    </div>
</header>

<div class="weekdays">
    <div>LUN</div><div>MAR</div><div>MIÉ</div><div>JUE</div><div>VIE</div><div>SÁB</div><div>DOM</div>
</div>

<div class="scroll-container">
    <div id="calendar" class="calendar-grid" aria-label="Calendario"></div>
</div>

<section id="weeklySummary" class="weekly-summary" aria-labelledby="weeklySummaryTitle">
    <div class="weekly-summary-heading">
        <h2 id="weeklySummaryTitle">Eventos de esta semana</h2>
        <span id="weeklySummaryProfile"></span>
    </div>
    <div id="weeklySummaryList" class="weekly-summary-list" aria-live="polite"></div>
</section>

<div id="detailModal" class="modal" onclick="if(event.target === this) closeModal()">
    <div class="modal-content">
        <button type="button" class="modal-close" onclick="closeModal()" aria-label="Cerrar detalle">×</button>
        
        <div class="modal-header">
            <div id="mDate" class="modal-date">Martes, 9 de diciembre</div>
            <div id="mWeatherDesc" class="modal-desc"></div> 
        </div>

        <div id="mHolidayBox" class="holiday-info" style="display:none;">
            <span id="mHolidayText"></span>
        </div>

        <div id="mFunnyVisual" class="funny-visual"></div>

        <div class="modal-data-row">
            <span>🌡️ Temperatura</span>
            <span id="mTemp" style="font-weight:bold">--</span>
        </div>
        <div class="modal-data-row">
            <span>💨 Viento</span>
            <span id="mWind">--</span>
        </div>
        <div class="modal-data-row">
            <span>🍃 Calidad Aire</span>
            <span id="mAir">--</span>
        </div>

        <div class="modal-actions">
            <a id="btnGoogle" href="#" target="_blank" class="btn-google">Ver clima en Google</a>
            <button type="button" id="addEventButton" class="btn-event">Añadir evento</button>
        </div>
        <div id="eventList" class="event-list" aria-live="polite"></div>

    </div>
</div>

<div id="eventFormModal" class="modal event-form-modal" onclick="if(event.target === this) closeEventForm()">
    <div class="modal-content">
        <button type="button" class="modal-close" onclick="closeEventForm()" aria-label="Cerrar formulario">×</button>
        <form id="eventForm" class="event-form">
            <h3 id="eventFormTitle">Nuevo evento</h3>
            <label>Título <input id="eventTitle" required maxlength="100" autocomplete="off"></label>
            <label>Descripción <textarea id="eventDescription" maxlength="500"></textarea></label>
            <label class="checkbox-label"><input id="eventAllDay" type="checkbox"> Todo el día</label>
            <label>Hora del evento
                <span class="notification-time-controls" aria-label="Hora del evento">
                    <select id="eventHour" aria-label="Hora del evento"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8" selected>8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option></select>
                    <select id="eventMinute" aria-label="Minutos del evento"><option value="00" selected>00</option><option value="05">05</option><option value="10">10</option><option value="15">15</option><option value="20">20</option><option value="25">25</option><option value="30">30</option><option value="35">35</option><option value="40">40</option><option value="45">45</option><option value="50">50</option><option value="55">55</option></select>
                    <select id="eventPeriod" aria-label="Periodo del evento"><option value="am" selected>a. m.</option><option value="pm">p. m.</option></select>
                </span>
                <small class="field-help">Hora de la cita o actividad. Para eventos de todo el día no se guarda hora.</small>
            </label>
            <label class="checkbox-label"><input id="eventNotify" type="checkbox" checked> Recibir notificación</label>
            <label>Hora del aviso
                <span class="notification-time-controls" aria-label="Hora del aviso">
                    <select id="notificationHour" aria-label="Hora"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8" selected>8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option></select>
                    <select id="notificationMinute" aria-label="Minutos"><option value="00" selected>00</option><option value="05">05</option><option value="10">10</option><option value="15">15</option><option value="20">20</option><option value="25">25</option><option value="30">30</option><option value="35">35</option><option value="40">40</option><option value="45">45</option><option value="50">50</option><option value="55">55</option></select>
                    <select id="notificationPeriod" aria-label="Periodo"><option value="am" selected>a. m.</option><option value="pm">p. m.</option></select>
                </span>
                <small id="notificationHelp" class="field-help">Por defecto 08:00. El aviso se entrega durante 10 minutos.</small>
            </label>
            <div class="form-actions">
                <button type="submit" class="btn-event">Guardar</button>
                <button type="button" id="cancelEventButton" class="btn-secondary">Cancelar</button>
            </div>
        </form>
    </div>
</div>

<div class="legend-container">
    <div class="legend-item">
        <span class="legend-color legend-color-nac"></span>
        <span class="legend-text">Festivo Nacional</span>
    </div>
    <div class="legend-item">
        <span class="legend-color legend-color-aut"></span>
        <span class="legend-text">Festivo Bizkaia/Autonómico</span>
    </div>
    <div class="legend-item">
        <span class="legend-color legend-color-loc"></span>
        <span class="legend-text">Festivo Local (Barakaldo/Bilbao)</span>
    </div>
</div>

<script src="script.js?v=20260908"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=20260908"></script>
<script src="calendar-app.js?v=20260908"></script>
</body>
</html>
